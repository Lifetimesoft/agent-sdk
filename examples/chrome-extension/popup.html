<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Agent</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      width: 320px;
      padding: 16px;
      margin: 0;
      color: #2d3748;
    }
    h1 { font-size: 16px; margin: 0 0 12px; }
    button {
      width: 100%;
      padding: 8px 16px;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
    }
    button:disabled { background: #a5b4fc; cursor: not-allowed; }
    #status { font-size: 12px; color: #718096; margin: 8px 0 0; min-height: 16px; }
    #summary { font-size: 13px; line-height: 1.5; margin-top: 12px; white-space: pre-wrap; }
    #last-summary { display: none; margin-top: 16px; border-top: 1px solid #e2e8f0; padding-top: 12px; }
    #last-summary h2 { font-size: 12px; color: #718096; margin: 0 0 6px; text-transform: uppercase; letter-spacing: 0.05em; }
    #last-summary-text { font-size: 13px; line-height: 1.5; }
    #last-summary-meta { font-size: 11px; color: #a0aec0; display: block; margin-top: 4px; }
  </style>
</head>
<body>
  <h1>🤖 Page Summariser</h1>
  <button id="summarise-btn">Summarise this page</button>
  <p id="status"></p>
  <p id="summary"></p>

  <div id="last-summary">
    <h2>Last summary</h2>
    <p id="last-summary-text"></p>
    <span id="last-summary-meta"></span>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
